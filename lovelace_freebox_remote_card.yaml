                    data: { key: '0' },
                }
          - type: button
            name: '⌫'
            tap_action:
                {
                    action: perform-action,
                    perform_action: freebox_player_remote.press,
                    data: { key: Backspace },
                }

    - type: markdown
      content: '### Lecture'

    - type: grid
      columns: 4
      square: false
      cards:
          - type: button
            name: Precedent
            icon: mdi:skip-previous
            tap_action:
                {
                    action: perform-action,
                    perform_action: freebox_player_remote.press,
                    data: { key: 'Previous track' },
                }
          - type: button
            name: Rewind
            icon: mdi:rewind
            tap_action:
                {
                    action: perform-action,
                    perform_action: freebox_player_remote.press,
                    data: { key: Rewind },
                }
          - type: button
            name: Avance
            icon: mdi:fast-forward
            tap_action:
                {
                    action: perform-action,
